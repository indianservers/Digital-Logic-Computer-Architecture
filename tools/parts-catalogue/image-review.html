<!doctype html><html><head><title>Component reference review</title><style>body{margin:12px;font:14px Arial;background:#eef3f7}main{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}figure{margin:0;background:white;padding:8px;border:1px solid #bbc9d6}img{width:100%;height:170px;object-fit:contain}strong{display:block;margin:6px 0}small{font-size:11px;overflow-wrap:anywhere}nav{margin:10px}</style></head><body><nav id="nav"></nav><main id="grid"></main><script type="module">const rows=await(await fetch('./image-review-data.json')).json();const page=Number(new URLSearchParams(location.search).get('page')??0);document.querySelector('#nav').textContent=`Page ${page+1} · ${rows.length} image families`;document.querySelector('#grid').innerHTML=rows.slice(page*12,page*12+12).map(p=>`<figure><img src="${p.thumbnail??p.src}"><strong>${p.family}</strong><small>${p.sourceTitle??p.caption}</small></figure>`).join('');</script></body></html>
